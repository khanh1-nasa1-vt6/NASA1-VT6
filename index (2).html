<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SELENE — Lunar Odyssey</title>
<style>
:root{color-scheme:dark;--gold:#ffd18b;--text:#e5f2ee;--line:#34566b}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font:14px Arial,sans-serif;background:radial-gradient(at 20% 0,#204557,transparent 65%),#071320}
main{max-width:1500px;margin:auto;padding:22px}
h1{margin:0;color:var(--gold);font-size:34px;letter-spacing:6px}
h2,h3{margin:0 0 12px}
h3{font-size:15px}
p{line-height:1.7}
header,.row,.buttons,.mission-strip,.setting,.scene-top,.progress-label{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
button,input,textarea,select{font:inherit;color:inherit;background:#153246;border:1px solid #597b89;border-radius:8px;padding:10px}
button{cursor:pointer}
button:hover{background:#245267;border-color:var(--gold)}
button:disabled{opacity:.45;cursor:default}
.primary{background:linear-gradient(120deg,#ffdb9c,#edb56c);color:#25343a;font-weight:bold}
.primary:hover{background:#ffe0a9}
[hidden]{display:none!important}
.eyebrow{font-size:9px;letter-spacing:2px;color:#91c5cd;margin-bottom:8px}
.small{font-size:12px;color:#a8c5d0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.left{min-width:0}
.panel{background:linear-gradient(140deg,#173548ee,#0d2031ee);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 10px 25px #0002}
.scene-top{padding:12px;background:#102638;font:10px monospace;letter-spacing:1px;color:#a4d3d4;border:1px solid var(--line);border-radius:12px 12px 0 0}
.scene{position:relative;overflow:hidden;border:1px solid #507286;border-radius:0 0 12px 12px;background:#071925}
canvas{display:block;width:100%;height:auto;touch-action:none}
.vitals{position:absolute;top:10px;left:10px;width:165px;padding:10px;background:#061827e8;border:1px solid #577f91;border-radius:10px;pointer-events:none}
.vital{font-size:10px;margin-bottom:6px}
.vital:last-child{margin:0}
.track{height:5px;background:#071621;border-radius:5px;overflow:hidden;margin-top:5px}
.track i{display:block;height:100%;background:#91e3c7}
.banner{position:absolute;top:10px;right:10px;max-width:50%;background:#452b26eb;border:1px solid #d9a778;color:#ffe0b6;padding:10px;border-radius:9px;font-size:11px;pointer-events:none}
.safe{background:#143b30eb;border-color:#82c6a2;color:#d1ffe2}
.prompt{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:95%;text-align:center;background:#061827ee;border:1px solid #b5a47f;border-radius:9px;padding:9px 13px;font-size:12px;pointer-events:none}
.mission-strip{padding:16px;margin-top:14px;background:linear-gradient(120deg,#173f38,#152c3e);border:1px solid #4e7b70;border-radius:12px;flex-wrap:nowrap}
.mission-strip strong{display:block;font-size:13px;line-height:1.7}
.mission-strip button{flex-shrink:0;font-size:12px}
.notice{padding:12px;margin:12px 0;border:1px solid #477977;background:#133432;border-radius:9px;font-size:12px;min-height:42px}
.danger{background:#492d2f;border-color:#b77873}
.inventory,.buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-start}
.inventory span{font-size:11px;padding:8px;border:1px solid #496b7b;border-radius:6px}
.task{padding:12px;border:1px solid #7a715a;border-left:3px solid #f1c285;background:#24374677;border-radius:8px;margin:9px 0;font-size:12px;line-height:1.7;cursor:pointer}
.task:hover{background:#38505c88}
.task.done{border-color:#74b78f;background:#1d3f3577;color:#ade6c1}
.progress-label{font-size:11px;color:#b5cfd2;margin:12px 0 7px}
.facility-btn{width:100%;display:block;margin:7px 0;font-size:12px;text-align:left;border-color:#36596c}
.mobile{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px auto;max-width:465px;user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,35px);gap:4px}
.dpad button{padding:0;touch-action:none}
.dpad [data-key=w]{grid-area:1/2}
.dpad [data-key=a]{grid-area:2/1}
.dpad [data-key=d]{grid-area:2/3}
.dpad [data-key=s]{grid-area:3/2}
.mobile .buttons button{height:52px;min-width:48px;touch-action:none}
#mobileRest{font-size:11px}
.timeline{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
.timeline div{padding:10px 5px;background:#122b3c;border:1px solid var(--line);border-radius:7px;font-size:11px;text-align:center}
.timeline .current{background:#4a4635;border-color:var(--gold);color:var(--gold)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{padding:12px;border:1px solid #375e71;background:#102b3e;border-radius:8px;font-size:12px;line-height:1.8}
.messages{height:270px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:9px;background:#071a29}
.message{max-width:92%;padding:12px;margin-bottom:10px;background:#1b4252;border:1px solid #456b77;border-radius:10px;font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.message.user{margin-left:auto;background:#244a40}
.message b{display:block;margin-bottom:5px;color:var(--gold)}
textarea{width:100%;min-height:75px;resize:vertical;margin:10px 0}
.answer{display:block;width:100%;text-align:left;margin:6px 0}
.correct{background:#24513c;border-color:#9fe7b6}
.wrong{background:#522e32;border-color:#e5a39b}
#log{max-height:130px;overflow:auto}
.logitem{font-size:11px;line-height:1.7;color:#abc4ce;margin-bottom:7px}
dialog{max-width:550px;width:calc(100% - 28px);max-height:90vh;overflow:auto;padding:24px;color:var(--text);background:linear-gradient(135deg,#1d4256,#0d2032);border:1px solid #6b929b;border-radius:15px;box-shadow:0 30px 80px #0008}
dialog::backdrop{background:#020c16c9}
.setting{padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap}
.setting label{flex:1}
.setting input[type=range]{width:44%;padding:0}
.setting input[type=text]{width:50%}
.setting output{min-width:38px;font-size:12px}
.launch-card{display:flex;align-items:center;gap:20px;padding:14px;margin:12px 0;width:100%;background:#244e5b;border:1px solid #54868d;border-radius:10px;font-size:40px}
.launch-card span{font:10px monospace;letter-spacing:1px}
.canvas-rest{position:absolute;right:12px;bottom:12px;z-index:3;max-width:43%;font-size:11px;padding:10px 12px;box-shadow:0 4px 20px #0005}
.simulation-note{font-size:12px;line-height:1.8;padding:12px;background:#153e3c;border:1px solid #527e75;border-radius:8px;color:#c5e5d8}
.result-card{padding:15px;margin-top:12px;border:1px solid #41697c;border-radius:10px;background:#0b2537}
.result-card h3{color:#ffe0a2;margin-top:9px}
.result-card strong{font-size:11px;color:#9cdbd4}
.result-card p{font-size:13px;margin:6px 0 12px}
.result-sources{display:flex;flex-wrap:wrap;gap:9px}
.result-sources a{color:#9fe8ee;font-size:11px;text-underline-offset:3px}
.report-meta{font-size:12px;color:#afedc9}
#reportSelect{max-width:100%;font-size:12px}
html{scroll-behavior:smooth}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.task:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-width:1000px){
.layout{grid-template-columns:1fr}
.aside{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.aside .panel{margin:0}
}
@media(max-width:600px){
main{padding:10px}h1{font-size:27px}
.aside{display:block}.aside .panel{margin-bottom:12px}
.panel{padding:13px}header button{font-size:11px;padding:8px}
.scene-top{font-size:8px;padding:10px}
.scene{display:flex;flex-direction:column}
.scene .vitals{position:relative;left:auto;top:auto;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border:0;border-bottom:1px solid #426577;border-radius:0;order:-1;padding:8px}
.vital{margin:0}
.vital .row{font-size:8px;gap:2px;flex-direction:column}
.vital .track{height:4px;margin-top:4px}
.banner{top:65px;font-size:9px;padding:6px}
.prompt{bottom:8px;font-size:9px;padding:6px}
.mission-strip{padding:12px;gap:8px}
.mission-strip strong{font-size:11px}
.mission-strip button{max-width:110px;font-size:10px}
.facts{grid-template-columns:1fr}
.timeline div{font-size:9px;padding:8px 2px}
.mobile{gap:8px}
.mobile .buttons button{min-width:40px;height:46px;padding:6px}
.dpad{grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,33px)}
.canvas-rest{bottom:45px;right:8px;font-size:9px;padding:8px;max-width:56%}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
<header>
<div>
<div class="eyebrow">LUNAR ODYSSEY / MISSION 07</div>
<h1>◒ SELENE</h1>
<p class="small" data-t="subtitle"></p>
</div>
<div class="buttons">
<button id="newBtn" class="primary" data-t="newGame"></button>
<button id="pauseBtn" data-t="pause"></button>
<button id="helpBtn" data-t="help"></button>
<button id="settingsBtn" data-t="settings"></button>
</div>
</header>

<div class="layout">
<section class="left">
<div class="scene-top">
<span>● SELENE / 89.9° S</span>
<span id="sceneLabel"></span>
</div>
<div class="scene">
<canvas id="game" width="1000" height="620" aria-label="SELENE"></canvas>
<div id="vitals" class="vitals"></div>
<div id="banner" class="banner" hidden></div>
<div id="prompt" class="prompt" hidden></div>
<button id="canvasRestBtn" class="primary canvas-rest" hidden></button>
</div>

<div class="mission-strip">
<div>
<div class="eyebrow" data-t="objective"></div>
<strong id="objectiveText"></strong>
</div>
<button id="restBtn" class="primary" data-t="rest"></button>
</div>

<div id="notice" class="notice" role="status" aria-live="polite"></div>

<section id="researchResults" class="panel">
<div class="row">
<h2 data-t="reportTitle"></h2>
<label class="small" for="reportSelect" data-t="reportHistory"></label>
<select id="reportSelect" aria-label="Analysis history"></select>
</div>
<p class="simulation-note" data-t="resultSimulation"></p>
<div id="reportBody" aria-live="polite"></div>
</section>

<div class="panel">
<h3 data-t="inventory"></h3>
<div id="inventory" class="inventory"></div>
<div class="buttons" style="margin-top:12px">
<button id="eatBtn"></button>
<button id="oxygenBtn"></button>
<button id="medBtn"></button>
<button id="baseBtn" data-t="baseToggle"></button>
<button id="shelterBtn" data-t="shelterToggle"></button>
</div>
</div>

<div class="mobile">
<div class="dpad">
<button data-key="w">↑</button>
<button data-key="a">←</button>
<button data-key="d">→</button>
<button data-key="s">↓</button>
</div>
<div class="buttons">
<button data-key="e">E</button>
<button data-key="shift">ϟ</button>
<button id="robotBtn">C</button>
<button id="mobileRest" data-t="restShort"></button>
</div>
</div>

<p class="small" data-t="controls"></p>
<div class="panel">
<h3 data-t="log"></h3>
<div id="log"></div>
</div>
<div class="panel">
<h2 data-t="explore"></h2>
<div id="facts" class="facts"></div>
</div>
<div class="panel" id="chatPanel">
<h2 data-t="chat"></h2>
<p class="small" data-t="chatInfo"></p>
<div id="messages" class="messages" role="log" aria-live="polite"></div>
<form id="chatForm">
<label class="small" for="question" data-t="question"></label>
<textarea id="question" maxlength="600" required></textarea>
<div class="buttons">
<button class="primary" type="submit" data-t="send"></button>
<button id="clearChat" type="button" data-t="clear"></button>
</div>
</form>
</div>
</section>

<aside class="aside">
<div class="panel">
<div class="row">
<h2 id="day"></h2>
<strong id="clock"></strong>
</div>
<h3 data-t="missions"></h3>
<div class="progress-label">
<span id="taskCount"></span>
<span id="scoreText"></span>
</div>
<div class="track"><i id="missionFill"></i></div>
<div id="tasks"></div>
<p class="small" id="stock"></p>
<button id="skipBtn" hidden data-t="skip"></button>
</div>

<div class="panel">
<h3 data-t="robot"></h3>
<strong id="robotName"></strong>
<p class="small" id="robotStatus"></p>
<div class="track"><i id="battery"></i></div>
<p class="small" id="science"></p>
<p class="small" id="labStatus"></p>
<button id="viewReportsBtn" data-t="viewReports"></button>
</div>

<div class="panel">
<h3 data-t="stations"></h3>
<div id="stations"></div>
</div>
<div class="panel">
<h3 data-t="quiz"></h3>
<p id="quizScore" class="small"></p>
<p id="quizQuestion"></p>
<div id="answers"></div>
<p id="quizFeedback" class="small"></p>
<div class="buttons">
<button id="quizNext" data-t="next"></button>
<button id="quizReset" data-t="reset"></button>
</div>
</div>
</aside>
</div>

<div id="timeline" class="timeline"></div>
</main>

<dialog id="startDialog">
<h2>◒ SELENE</h2>
<p data-t="intro"></p>
<div class="setting">
<label for="difficulty" data-t="difficulty"></label>
<select id="difficulty">
<option value="easy" data-t="easy"></option>
<option value="normal" data-t="normal"></option>
<option value="hard" data-t="hard"></option>
</select>
</div>
<p class="small" data-t="controls"></p>
<div class="launch-card">☾ <span>EXPLORE · REPAIR · SURVIVE</span></div>
<div class="buttons">
<button id="startBtn" class="primary" data-t="start"></button>
<button id="continueBtn" data-t="continue"></button>
</div>
</dialog>

<dialog id="settingsDialog">
<h2 data-t="settings"></h2>
<div class="setting">
<label for="language" data-t="language"></label>
<select id="language">
<option value="vi">Tiếng Việt</option>
<option value="en">English</option>
<option value="zh">中文</option>
</select>
</div>
<div class="setting">
<label for="nameInput" data-t="robotName"></label>
<input id="nameInput" type="text" maxlength="18">
</div>
<div class="setting">
<label for="soundToggle" data-t="sound"></label>
<input id="soundToggle" type="checkbox">
</div>
<div class="setting">
<label for="musicToggle" data-t="music"></label>
<input id="musicToggle" type="checkbox">
</div>
<div class="setting">
<label for="sfxToggle" data-t="sfx"></label>
<input id="sfxToggle" type="checkbox">
</div>
<div class="setting">
<label for="masterRange" data-t="master"></label>
<input id="masterRange" type="range" min="0" max="100">
<output id="masterOut"></output>
</div>
<div class="setting">
<label for="musicRange" data-t="musicVolume"></label>
<input id="musicRange" type="range" min="0" max="100">
<output id="musicOut"></output>
</div>
<div class="setting">
<label for="sfxRange" data-t="sfxVolume"></label>
<input id="sfxRange" type="range" min="0" max="100">
<output id="sfxOut"></output>
</div>
<p class="small" data-t="audioHint"></p>
<button data-close="settingsDialog" class="primary" data-t="close"></button>
</dialog>

<dialog id="helpDialog">
<h2 data-t="help"></h2>
<p data-t="guide"></p>
<p data-t="controls"></p>
<button data-close="helpDialog" class="primary" data-t="close"></button>
</dialog>

<dialog id="endDialog">
<h2 id="endTitle"></h2>
<p id="endText"></p>
<button id="replayBtn" class="primary" data-t="newGame"></button>
</dialog>

<script>

const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d');

if(!Array.isArray(r.sampleBag))r.sampleBag=[];

while(r.sampleBag.length<r.samples){

});

while(l.batch.length<l.pending){
l.batch.push({
id:'OLD-LAB-D'+g.day+'-'+(l.batch.length+1),

p&&typeof p.id==='string'&&Number.isInteger(p.day)&&

function save(){
if(!g||!['playing','paused','sleeping'].includes(g.status))return;
const s=JSON.parse(JSON.stringify(g));
s.status='paused';
if(g.status==='sleeping'){
s.player.x=BED.x;s.player.y=BED.y;
s.robot.x=445;s.robot.y=480;
}
s.meteors=[];
s.progress=0;
s.repairId=-1;
if(s.robot.mode==='charge'&&s.robot.job)s.robot.mode='follow';
s.robot.job=null;
delete s.robot.followPath;
if(['sample','lab'].includes(s.robot.mode))s.robot.mode='follow';

function load(){
const s=read(STORE);
if(!s||!s.player||!s.robot||!Number.isInteger(s.day)||
s.day<1||s.day>7||!CONFIG[s.level]||!Array.isArray(s.tasks))return null;

if(s.version===1){
s.tasks.forEach(t=>{t.site=t.site===5?8:t.site>5?t.site-1:t.site});
s.insideShelter=!!s.insideShelter;
s.version=2;
}
if(s.version===2){
s.tasks.forEach(t=>{if(t.site===0&&t.tool===3)t.site=8});
s.version=3;
s.depot=Array(6).fill(0);
for(const t of s.tasks)if(!t.done)s.depot[t.tool]++;
s.depot=s.depot.map((n,i)=>Math.max(0,n-(s.inventory?.[i]||0)));
s.lab={phase:'idle',time:0,pending:0,total:0};
}

if(s.version!==3||s.tasks.length!==plan[s.day-1].length||
!Array.isArray(s.inventory)||s.inventory.length!==6||
!Array.isArray(s.depot)||s.depot.length!==6||
!Array.isArray(s.soilUsed)||s.soilUsed.length!==3||
!Array.isArray(s.logs)||!s.storm||!s.lab)return null;

for(const k of [
'time','health','oxygen','hunger','energy','food',
'foodStock','oxygenKits','medkits','science'
]){
if(!Number.isFinite(s[k])||s[k]<0)return null;
}
if(s.health<=0||s.time<=0||
!['calm','warning','active'].includes(s.storm.phase)||
!Number.isFinite(s.storm.timer))return null;

for(const p of [s.player,s.robot]){
if(!Number.isFinite(p.x)||!Number.isFinite(p.y)||
p.x<0||p.x>W||p.y<0||p.y>H)return null;
}
if(!Number.isFinite(s.robot.battery)||s.robot.battery<0||
!Number.isInteger(s.robot.samples)||s.robot.samples<0||
s.robot.samples>3)return null;

if([...s.inventory,...s.depot].some(v=>!Number.isInteger(v)||v<0)||
s.tasks.some((t,i)=>!t||t.site!==plan[s.day-1][i][0]||
t.tool!==plan[s.day-1][i][1]||typeof t.done!=='boolean'))return null;

if(!['idle','delivery','scan','spectrum','complete'].includes(s.lab.phase)||
!Number.isFinite(s.lab.time)||
!Number.isInteger(s.lab.pending)||s.lab.pending<0||s.lab.pending>3||
!Number.isFinite(s.lab.total))return null;

s.insideShelter=!!s.insideShelter;
s.insideBase=!!s.insideBase&&!s.insideShelter;
s.robot.job=null;
if(!['carry','charge'].includes(s.robot.mode))s.robot.mode='follow';
if(s.lab.phase==='delivery')s.lab.phase='idle';
return s;
}

const Audio={
ctx:null,master:null,music:null,sfx:null,next:0,step:0,
async init(){
try{
if(!this.ctx){
const AC=window.AudioContext||window.webkitAudioContext;
if(!AC)return;
this.ctx=new AC();
this.master=this.ctx.createGain();
this.music=this.ctx.createGain();
this.sfx=this.ctx.createGain();
const limiter=this.ctx.createDynamicsCompressor();
limiter.threshold.value=-8;
limiter.knee.value=12;
limiter.ratio.value=8;
limiter.attack.value=.003;
limiter.release.value=.2;
this.music.connect(this.master);
this.sfx.connect(this.master);
this.master.connect(limiter);
limiter.connect(this.ctx.destination);
this.next=this.ctx.currentTime+.1;
}
if(this.ctx.state==='suspended')await this.ctx.resume();
this.apply();
}catch{}
},
apply(){
if(!this.ctx)return;
const t=this.ctx.currentTime;
this.master.gain.setTargetAtTime(prefs.sound?prefs.master/100:0,t,.05);
this.music.gain.setTargetAtTime(prefs.music?prefs.musicVolume/100:0,t,.05);
this.sfx.gain.setTargetAtTime(prefs.sfx?prefs.sfxVolume/100:0,t,.05);
},
tone(f,d=.2,a=.12,type='sine',bus='sfx',when=0){
if(!this.ctx||this.ctx.state!=='running')return;
const t=when||this.ctx.currentTime;
const o=this.ctx.createOscillator(),v=this.ctx.createGain();
o.type=type;o.frequency.value=f;
v.gain.setValueAtTime(.0001,t);
v.gain.exponentialRampToValueAtTime(Math.max(.0002,a),t+.018);
v.gain.exponentialRampToValueAtTime(.0001,t+d);
o.connect(v);v.connect(this[bus]);
o.start(t);o.stop(t+d+.02);
o.onended=()=>{o.disconnect();v.disconnect()};
},
play(k){
const t=this.ctx?.currentTime||0;
if(k==='repair'){
this.tone(220,.075,.1,'triangle');this.tone(660,.08,.045);
}else if(k==='alarm'){
this.tone(660,.2,.16,'triangle');
this.tone(440,.2,.13,'triangle','sfx',t+.25);
}else if(k==='impact'){
this.tone(55,.4,.25,'sawtooth');
}else if(k==='done'){
[523,659,784,1047].forEach((f,i)=>this.tone(f,.35,.16,'sine','sfx',t+i*.12));
}else if(k==='door'){
this.tone(120,.3,.15,'triangle');
this.tone(300,.2,.1,'sine','sfx',t+.1);
}else if(k==='eat'){
this.tone(260,.12,.14,'triangle');
this.tone(350,.15,.1,'triangle','sfx',t+.13);
}else{
this.tone(660,.12,.12);
this.tone(880,.2,.1,'sine','sfx',t+.09);
}
},
tick(){
if(!this.ctx||this.ctx.state!=='running')return;
const t=this.ctx.currentTime;
if(!prefs.sound||!prefs.music||document.hidden){this.next=t+.1;return}
if(this.next<t)this.next=t+.05;
const notes=[
261.63,329.63,392,523.25,440,392,329.63,293.66,
261.63,392,440,523.25,587.33,523.25,392,329.63
];
while(this.next<t+.25){
this.tone(notes[this.step%notes.length],.7,.22,'sine','music',this.next);
if(this.step%2===0){
this.tone(this.step%8<4?130.81:146.83,1.3,.13,'triangle','music',this.next);
}
this.step++;this.next+=.48;
}
}
};

function isInside(){return g.insideBase||g.insideShelter}
function roomId(){return g.insideShelter?8:0}
function done(){return g.tasks.every(t=>t.done)}

function blocked(x,y){
if(isInside()){
if(x<185||x>815||y<300||y>510)return true;
return [
...(g.insideBase?[{x:422,y:267,w:222,h:73}]:[]),
{x:198,y:267,w:189,h:73},
{x:207,y:383,w:210,h:81},
{x:751,y:278,w:69,h:90}
].some(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h);
}
if(x<18||x>982||y<58||y>597)return true;
return buildings.some(b=>
Math.abs(x-b.x)<b.w/2+10&&Math.abs(y-b.y)<b.h/2+9);
}

function pathTo(goal,startPoint=g.player){
const key=(x,y)=>x+','+y;
let start={
x:Math.round(startPoint.x/10)*10,
y:Math.round(startPoint.y/10)*10
};
if(blocked(start.x,start.y)){
const candidates=[];
for(let dx=-1;dx<=1;dx++){
for(let dy=-1;dy<=1;dy++){
candidates.push({x:start.x+dx*10,y:start.y+dy*10});
}
}
start=candidates.filter(p=>!blocked(p.x,p.y))
.sort((a,b)=>dist(a,startPoint)-dist(b,startPoint))[0];
if(!start)return [];
}

const q=[start],parent=new Map([[key(start.x,start.y),null]]);
let end=null;
for(let h=0;h<q.length&&h<6200;h++){
const p=q[h];
if(dist(p,goal)<12){end=p;break}
for(const [dx,dy]of [[10,0],[-10,0],[0,10],[0,-10]]){
const n={x:p.x+dx,y:p.y+dy},k=key(n.x,n.y);
if(!parent.has(k)&&!blocked(n.x,n.y)){
parent.set(k,p);q.push(n);
}
}
}
if(!end)return [];
const result=[];
for(let p=end;p;p=parent.get(key(p.x,p.y)))result.push(p);
result.reverse();result.push({...goal});
return result;
}

function gotoSite(id){
if(g.status!=='playing'||isInside())return;
const path=pathTo(front(id));
if(!path.length){notice(T('blocked'),true);return}
route=path;route.site=id;held.clear();notice(T('walking'));
}
function toggleBase(){
if(g.status!=='playing')return;
if(isInside()){
if(dist(g.player,DOOR)<58)exitBase();
else goRoom(DOOR,'exit');
}else if(dist(g.player,front(0))<70)enterBase();
else gotoSite(0);
}
function toggleShelter(){
if(g.status!=='playing')return;
if(isInside()){
if(g.insideShelter)toggleBase();else navigateFacility(8);
}else if(dist(g.player,front(8))<70)enterBase(8);
else gotoSite(8);
}
function enterBase(id=0){
if(g.status!=='playing'||isInside())return;
if(dist(g.player,front(id))>70){gotoSite(id);return}
g.wasCarried=g.robot.mode==='carry';
cancelRobotJob();
g.insideBase=id===0;g.insideShelter=id===8;
Object.assign(g.player,{x:630,y:445,face:'left'});
Object.assign(g.robot,{x:580,y:455,mode:'follow',job:null});
held.clear();route=[];g.progress=0;g.repairId=-1;
notice(T('baseWelcome'));Audio.play('door');render();save();
}
function exitBase(){
if(g.status!=='playing'||!isInside())return;
if(dist(g.player,DOOR)>58){goRoom(DOOR,'exit');return}
const id=roomId();
g.insideBase=false;g.insideShelter=false;
Object.assign(g.player,front(id));
Object.assign(g.robot,{
x:g.player.x-38,y:g.player.y+7,
mode:g.wasCarried?'carry':'follow',job:null,
followPath:[],followClock:0
});
g.wasCarried=false;held.clear();route=[];
g.progress=0;g.repairId=-1;
Audio.play('door');render();save();

function goRoom(point,action=''){
if(g.status!=='playing'||!isInside())return;
route=pathTo(point);
if(!route.length){notice(T('blocked'),true);return}
route.action=action;held.clear();
}
function rest(){
if(g.status!=='playing')return;
if(!done()){notice(T('restLocked'),true);return}
if(g.insideShelter){goRoom(DOOR,'rest');return}
if(g.insideBase){
if(dist(g.player,BED)<48)startSleep();else goRoom(BED,'sleep');
return;
}
if(dist(g.player,front(0))<70){
enterBase();goRoom(BED,'sleep');
}else{
gotoSite(0);if(route.length)route.action='rest';
}
}
function startSleep(){
if(g.status!=='playing'||!g.insideBase)return;
if(!done()){notice(T('restLocked'),true);return}
if(dist(g.player,BED)>48){goRoom(BED,'sleep');return}
g.status='sleeping';g.sleep=0;held.clear();route=[];
g.progress=0;g.repairId=-1;
notice(T('restWait'));Audio.play('door');render();
}
function guideTask(i){
if(g.status!=='playing')return;
const t=g.tasks[i];if(t.done)return;
if(isInside()){
if(g.insideBase&&g.inventory[t.tool]<1){goRoom(TOOL_RACK);return}
if(t.site===roomId()&&g.inventory[t.tool]>0){goRoom(CONSOLE);return}
goRoom(DOOR,'task');route.nextTask=i;return;
}
if(g.inventory[t.tool]>0){
gotoSite(t.site);
if([0,8].includes(t.site)&&route.length)route.action='console';
return;
}
gotoSite(0);if(route.length)route.action='tools';notice(T('getTools'));
}
function navigateFacility(id){
if(g.status!=='playing')return;
if(isInside()){
if(id===roomId()){goRoom(CONSOLE);return}
goRoom(DOOR,'site');route.nextSite=id;
}else gotoSite(id);
}
function collectTools(only=-1){
if(!g.insideBase||dist(g.player,TOOL_RACK)>82)return;
let count=0;
g.depot.forEach((n,i)=>{
if(n>0&&(only<0||only===i)){
g.inventory[i]+=n;g.depot[i]=0;count+=n;
}
});
notice(T(count?'toolsCollected':'rackEmpty'));
if(count)Audio.play('pickup');
render();save();
}

/* ROBOT */
function robotPath(target){return pathTo(target,g.robot)}
function cancelRobotJob(){
if(g.robot.mode==='lab'&&g.lab.phase==='delivery')g.lab.phase='idle';
g.robot.mode='follow';g.robot.job=null;
g.robot.followPath=[];g.robot.followClock=0;
}
function beginRobotJob(mode,target,id=-1){
const r=g.robot;cancelRobotJob();
if(blocked(r.x,r.y)){
let best=null;
for(let k=1;k<=8&&!best;k++){
for(let dx=-k;dx<=k;dx++){
for(const dy of [-k,k]){
const p={x:Math.round(r.x/10)*10+dx*10,y:Math.round(r.y/10)*10+dy*10};
if(!blocked(p.x,p.y)&&(!best||dist(r,p)<dist(r,best)))best=p;
}
}
}
if(best){r.x=best.x;r.y=best.y}
}
const path=robotPath(target);
if(!path.length&&dist(r,target)>12){
notice(T('robotPathFail'),true);return false;
}
r.mode=mode;
r.job={id,target:{...target},path,time:0,stuck:0,attempts:0};
notice(T('robotBusy'));
return true;
}
function robotWalk(r,dt){
const j=r.job;if(!j)return false;
const p=j.path;
while(p.length&&dist(r,p[0])<3){
r.x=p[0].x;r.y=p[0].y;p.shift();
}
if(!p.length)return true;

const next=p[0],d=dist(r,next),step=Math.min(d,145*dt);
const old={x:r.x,y:r.y};
const x=r.x+(next.x-r.x)/Math.max(.001,d)*step;
const y=r.y+(next.y-r.y)/Math.max(.001,d)*step;
if(!blocked(x,r.y))r.x=x;
if(!blocked(r.x,y))r.y=y;
j.stuck=dist(old,r)<.01?j.stuck+dt:0;

if(j.stuck>1){
j.stuck=0;j.path=robotPath(j.target);j.attempts++;
if(!j.path.length||j.attempts>3){
cancelRobotJob();notice(T('robotPathFail'),true);return false;
}
}
return false;
}

function nearby(){
if(isInside()){
const i=g.tasks.findIndex(t=>t.site===roomId()&&!t.done);
if(i>=0&&dist(g.player,CONSOLE)<55){
return {
kind:'repair',id:i,
text:(g.inventory[g.tasks[i].tool]>0?T('repair'):T('needTool'))
+' · '+toolName(g.tasks[i].tool)
};
}
if(g.insideBase&&dist(g.player,BED)<48){
return {kind:'bed',text:done()?T('restBed'):T('restLocked')};
}
if(g.insideBase&&dist(g.player,TOOL_RACK)<82){
return {kind:'tools',text:T('getTools')};
}
if(dist(g.player,DOOR)<58)return {kind:'exit',text:T('roomExit')};
return {kind:'room',text:T('roomMove')};
}

const near=id=>dist(g.player,front(id))<55;
if(near(0))return {kind:'base',id:0,text:T('baseEnter')};
if(near(8))return {kind:'base',id:8,text:T('shelterEnter')};
if(near(5))return {kind:'food',text:T('takeFood')};
if(near(6))return {kind:'charge',text:T('charging')};
if(near(7))return {kind:'lab',text:T('research')};

for(let i=0;i<soil.length;i++){
if(!g.soilUsed[i]&&dist(g.player,soil[i])<45){
return {kind:'soil',id:i,text:T('takeSample')};
}
}
for(let i=0;i<g.tasks.length;i++){
const t=g.tasks[i];
if(![0,8].includes(t.site)&&!t.done&&near(t.site)){
return {
kind:'repair',id:i,
text:(g.inventory[t.tool]>0?T('repair'):T('needTool'))+' · '+toolName(t.tool)
};
}
}
for(let i=0;i<soil.length;i++){
if(g.soilUsed[i]&&dist(g.player,soil[i])<45){
return {kind:'usedSoil',text:T('soilUsed')};
}
}
return null;
}

function interact(){
if(g.status!=='playing')return;
const n=nearby();if(!n)return;
if(n.kind==='base'){enterBase(n.id);return}
if(n.kind==='bed'){startSleep();return}
if(n.kind==='exit'){exitBase();return}
if(n.kind==='tools'){collectTools();return}
if(n.kind==='usedSoil'){notice(T('soilUsed'));return}

if(n.kind==='food'){
if(g.foodStock>0){
const count=Math.min(2,g.foodStock);
g.food+=count;g.foodStock-=count;
notice(T('received')+' +'+count);Audio.play('pickup');
}else notice(T('empty'));
}else if(n.kind==='charge'){
if(g.robot.mode==='charge')cancelRobotJob();
else beginRobotJob('charge',front(6));
}else if(n.kind==='soil'){
const r=g.robot;
if(r.battery<10){notice(T('lowBattery'),true);return}
if(r.samples>=3){notice(T('samplesFull'),true);return}
if(g.soilUsed[n.id]){notice(T('soilUsed'));return}
if(r.mode==='sample'&&r.job?.id===n.id){
r.job.path=robotPath(soil[n.id]);r.job.stuck=0;
notice(T('robotBusy'));return;
}
beginRobotJob('sample',soil[n.id],n.id);
}else if(n.kind==='lab'){
if(!['idle','complete'].includes(g.lab.phase)){notice(T('labBusy'));return}
if(!g.robot.samples){notice(T('noSamples'));return}
if(beginRobotJob('lab',front(7))){
g.lab.phase='delivery';g.lab.time=0;
}
}
render();save();
}

function eat(){
if(g.status!=='playing')return;
if(g.hunger>=99){notice(T('full'));return}
if(g.food<1){notice(T('noFood'),true);return}
g.food--;g.hunger=clamp(g.hunger+40);
notice(T('ate'));Audio.play('eat');render();save();
}
function useItem(type){
if(g.status!=='playing')return;
const key=type==='oxygen'?'oxygenKits':'medkits';
const stat=type==='oxygen'?'oxygen':'health';
if(g[key]<1||g[stat]>=99){notice(T('unavailable'));return}
g[key]--;g[stat]=clamp(g[stat]+35);
notice(T('used'));Audio.play('pickup');render();save();
}
function carry(){
if(g.status!=='playing')return;
const r=g.robot;
if(r.mode==='carry'){
r.mode='follow';r.x=g.player.x-38;r.y=g.player.y+7;
r.followPath=[];r.followClock=0;
}else if(dist(r,g.player)<65){
cancelRobotJob();r.mode='carry';
}
render();
}

function robotUpdate(dt){
const r=g.robot;
if(['charge','sample','lab'].includes(r.mode)){
if(!r.job){
if(r.mode==='charge'){r.battery=clamp(r.battery+18*dt);return}
cancelRobotJob();return;
}
if(r.mode==='sample'&&r.battery<=0){
cancelRobotJob();notice(T('lowBattery'),true);return;
}
if(!robotWalk(r,dt))return;
if(r.mode==='charge'){
r.job=null;Audio.play('pickup');return;
}
if(r.mode==='lab'){
normalizeResearch();
const count=r.samples;
const batch=r.sampleBag.splice(0,count);
r.samples=0;
cancelRobotJob();
g.lab.phase='scan';g.lab.time=0;
g.lab.pending=count;g.lab.batch=batch;
Audio.play('pickup');save();return;
}

const job=r.job;
if(g.soilUsed[job.id]){cancelRobotJob();return}
job.time+=dt;
r.battery=clamp(r.battery-2*dt);

if(job.time>=3){
normalizeResearch();
g.soilUsed[job.id]=true;
r.sampleBag.push({
id:'D'+g.day+'-P'+(job.id+1),
day:g.day,deposit:job.id,
type:(g.day-1+job.id)%SAMPLE_TYPES.length
});
r.samples++;g.score+=20;
cancelRobotJob();notice(T('collected'));Audio.play('done');save();
}
return;
}
if(r.mode==='carry'){
r.x=g.player.x-38;r.y=g.player.y+7;return;
}
if(r.battery<=0&&!isInside())return;
r.followClock=(r.followClock||0)-dt;
if(dist(r,g.player)<47){r.followPath=[];return}
if(r.followClock<=0||!r.followPath?.length){
r.followClock=.7;r.followPath=robotPath(g.player);
}
const path=r.followPath||[];
while(path.length&&dist(r,path[0])<4)path.shift();
if(!path.length)return;
const p=path[0],d=dist(r,p),step=Math.min(d,145*dt);
const x=r.x+(p.x-r.x)/Math.max(.001,d)*step;
const y=r.y+(p.y-r.y)/Math.max(.001,d)*step;
if(!blocked(x,r.y))r.x=x;
if(!blocked(r.x,y))r.y=y;
if(!isInside())r.battery=clamp(r.battery-.035*dt);
}

/* BÁO CÁO NGHIÊN CỨU */

const l=g.lab;
const items=l.batch.slice(0,count).map(i=>({...i}));
const report={
id:'SELENE-R'+(++l.reportSeq),
day:g.day,count,points:count*10,items
};
l.reports.push(report);
l.reports=l.reports.slice(-30);
l.pending=0;l.batch=[];
selectedReportId=report.id;
renderReports();
}
function resultNode(tag,value,className=''){

el.textContent=value;
if(className)el.className=className;
return el;
}

if(!g||!$('researchResults'))return;
normalizeResearch();
const reports=g.lab.reports;
if(!reports.some(p=>p.id===selectedReportId)){
selectedReportId=reports.at(-1)?.id||'';
}

T('gameDeposit')+' '+(item.deposit+1)),'small'));
card.append(resultNode('h3',sampleText(item,'name')));
card.append(resultNode('strong',T('composition')));
card.append(resultNode('p',sampleText(item,'composition')));
card.append(resultNode('strong',T('meaning')));
card.append(resultNode('p',sampleText(item,'meaning')));

const links=document.createElement('div');

function updateLab(dt){
const l=g.lab;
if(['idle','delivery'].includes(l.phase))return;
l.time+=dt;
if(l.phase==='scan'&&l.time>=3){
l.phase='spectrum';l.time=0;Audio.play('pickup');
}else if(l.phase==='spectrum'&&l.time>=3){
const n=l.pending;
createResearchReport(n);
l.pending=0;l.total+=n;
g.science+=n*10;g.score+=n*30;
l.phase='complete';l.time=0;
notice(T('resultReady')+' · +'+n*10);
Audio.play('done');save();
}else if(l.phase==='complete'&&l.time>=2){
l.phase='idle';l.time=0;
}
}

/* THIÊN THẠCH */
function stormUpdate(dt){
const s=g.storm;
s.timer-=dt;
if(s.timer<=0){
if(s.phase==='calm'){
s.phase='warning';s.timer=8;s.beep=-1;
notice(T('warning')+' 8s',true);Audio.play('alarm');
}else if(s.phase==='warning'){
s.phase='active';s.timer=14+g.day;s.spawn=0;
notice(T('storm'),true);Audio.play('alarm');
}else{s.phase='calm';s.timer=32+Math.random()*20}
}
if(s.phase==='warning'){
const n=Math.ceil(s.timer);
if(s.beep!==n){s.beep=n;Audio.play('alarm')}
}
if(s.phase==='active'){
s.spawn-=dt;
if(s.spawn<=0){
s.spawn=.7;
const aimed=Math.random()<.45;
g.meteors.push({
x:aimed?g.player.x+(Math.random()-.5)*65:30+Math.random()*940,
y:aimed?g.player.y+(Math.random()-.5)*65:70+Math.random()*500,
r:25+Math.random()*15,t:1.25,hit:false
});
}
}
for(const m of g.meteors){
m.t-=dt;
if(m.t<=0&&!m.hit){
m.hit=true;m.t=.5;
if(!isInside()&&dist(g.player,m)<m.r+12){
g.health-=18*CONFIG[g.level].damage;Audio.play('impact');
}
if(!isInside()&&dist(g.robot,m)<m.r+12){
g.robot.battery=clamp(g.robot.battery-8);
}
}
}
g.meteors=g.meteors.filter(m=>m.t>0);
}

/* VÒNG LẶP GAME */
function update(dt){
if(['playing','sleeping','rescue'].includes(g.status))updateLab(dt);
if(g.status==='sleeping'){
g.sleep+=dt;
g.health=clamp(g.health+15*dt);
g.oxygen=clamp(g.oxygen+25*dt);
g.energy=100;
if(g.sleep>=3.2)completeDay();
return;
}
if(g.status==='rescue'){rescueUpdate(dt);return}
if(g.status!=='playing')return;

const c=CONFIG[g.level];
g.time-=dt;
g.hunger=clamp(g.hunger-.17*dt);
const base=!isInside()&&dist(g.player,front(0))<65;
if(isInside()||base)g.oxygen=clamp(g.oxygen+7*dt);
else g.oxygen=clamp(g.oxygen-c.oxy*dt*(held.has('shift')?1.45:1));
if(g.hunger<=0)g.health-=2*c.damage*dt;
if(g.oxygen<=0)g.health-=9*c.damage*dt;

let dx=(held.has('d')||held.has('arrowright')?1:0)-
(held.has('a')||held.has('arrowleft')?1:0);
let dy=(held.has('s')||held.has('arrowdown')?1:0)-
(held.has('w')||held.has('arrowup')?1:0);
let maxStep=Infinity;
if(dx||dy)route=[];

if(route.length){
const p=route[0],d=dist(g.player,p);
if(d<4){
g.player.x=p.x;g.player.y=p.y;route.shift();
if(!route.length){
const site=route.site,action=route.action;
const nextTask=route.nextTask,nextSite=route.nextSite;
route=[];
if(!isInside()&&[0,8].includes(site)){
enterBase(site);
if(action==='rest')goRoom(BED,'sleep');
if(action==='console')goRoom(CONSOLE);
if(action==='tools')goRoom(TOOL_RACK);
return;
}
if(g.insideBase&&action==='sleep'){startSleep();return}
if(isInside()&&['exit','task','site','rest'].includes(action)){
exitBase();
if(action==='task')guideTask(nextTask);
if(action==='site')gotoSite(nextSite);
if(action==='rest')rest();
return;
}
}
}else{
dx=(p.x-g.player.x)/d;dy=(p.y-g.player.y)/d;maxStep=d;
}
}
const moving=!!(dx||dy);
if(moving){
const n=Math.hypot(dx,dy),run=held.has('shift')&&g.energy>2;
const step=Math.min((run?205:135)*dt,maxStep);
dx/=n;dy/=n;
const x=g.player.x+dx*step,y=g.player.y+dy*step;
if(!blocked(x,g.player.y))g.player.x=x;
if(!blocked(g.player.x,y))g.player.y=y;
g.player.face=Math.abs(dx)>Math.abs(dy)
?dx>0?'right':'left':dy>0?'down':'up';
g.energy=clamp(g.energy+(run?-18:6)*dt);
}else g.energy=clamp(g.energy+14*dt);

robotUpdate(dt);
stormUpdate(dt);
const near=nearby();

if(held.has('e')&&near?.kind==='repair'&&
g.inventory[g.tasks[near.id].tool]>0&&!moving){
if(g.repairId!==near.id){g.repairId=near.id;g.progress=0}
g.progress+=dt;repairBeep-=dt;
if(repairBeep<=0){Audio.play('repair');repairBeep=.22}
const b=isInside()?{x:350,y:300}:front(g.tasks[near.id].site);

if(Math.random()<.8){
fx.push({
x:b.x,y:b.y,vx:(Math.random()-.5)*170,
vy:-40-Math.random()*110,life:.6,
color:Math.random()<.5?'#ffe0a1':'#9bf5ed'
});
}
if(g.progress>=c.repair){
const t=g.tasks[near.id];t.done=true;
repairPulses.push({x:b.x,y:b.y,life:.9});
for(let j=0;j<24;j++){
const a=j*Math.PI/12;
fx.push({
x:b.x,y:b.y,vx:Math.cos(a)*110,
vy:Math.sin(a)*90,life:.8,color:'#a7ffe0'
});
}
g.score+=100;g.inventory[t.tool]--;
g.health=clamp(g.health+5);
g.progress=0;g.repairId=-1;
notice(T('fixed')+' · '+siteName(t.site));
Audio.play('done');
if(done())notice(T('returnBase'));
render();save();
}
}else{g.progress=0;g.repairId=-1}

if(g.health<=0||g.time<=0)finish(false);
for(const f of fx){
f.life-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=180*dt;
}
fx=fx.filter(f=>f.life>0);
repairPulses.forEach(p=>p.life-=dt);
repairPulses=repairPulses.filter(p=>p.life>0);
saveTime+=dt;
if(saveTime>5){saveTime=0;save()}
}

function completeDay(){
if(g.status!=='sleeping'||!g.insideBase||!done())return;
g.score+=Math.ceil(g.time)+100;
if(g.day===7){startRescue();return}
g.day++;g.status='playing';
g.health=clamp(g.health+15);
g.oxygen=100;g.hunger=clamp(g.hunger+20);g.energy=100;
g.robot.battery=clamp(g.robot.battery+25);
daySetup();Audio.play('done');save();
}
function finish(win){
g.status=win?'won':'lost';
held.clear();route=[];remove(STORE);
$('endTitle').textContent=T(win?'won':'lost');
$('endText').textContent=T(win?'winText':'loseText');
$('endDialog').showModal();$('skipBtn').hidden=true;
Audio.play(win?'done':'impact');render();
}

/* CHUYẾN BAY VỀ TRÁI ĐẤT */
function startRescue(){
g.status='rescue';
g.insideBase=false;g.insideShelter=false;
Object.assign(g.player,front(0));
Object.assign(g.robot,{x:g.player.x-25,y:g.player.y});
g.robot.mode='follow';g.robot.job=null;
g.rescue={phase:'boarding',t:0,p:{...g.player},r:{...g.robot}};
g.meteors=[];held.clear();route=[];remove(STORE);
$('skipBtn').hidden=false;Audio.play('done');
}
function rescueUpdate(dt){
const r=g.rescue;r.t+=dt;
const duration={boarding:4,launch:4,space:6,landing:4,reception:6};
if(r.t>duration[r.phase]){
const next={boarding:'launch',launch:'space',space:'landing',landing:'reception'}[r.phase];
if(!next){finish(true);return}
r.phase=next;r.t=0;
Audio.play(next==='launch'?'impact':'pickup');
}
}

/* ĐỒ HỌA */
function rect(x,y,w,h,fill,stroke,r=6){
ctx.beginPath();ctx.roundRect(x,y,w,h,r);
if(fill){ctx.fillStyle=fill;ctx.fill()}
if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
}
function ellipse(x,y,rx,ry,fill,stroke){
ctx.beginPath();
ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);
if(fill){ctx.fillStyle=fill;ctx.fill()}
if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
}
function line(points,color,width=1){
ctx.beginPath();ctx.moveTo(...points[0]);
for(let i=1;i<points.length;i++)ctx.lineTo(...points[i]);
ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
}
function text(s,x,y,size=12,color='#e5f2ee'){
ctx.fillStyle=color;ctx.font=size+'px Arial';
ctx.textAlign='center';ctx.fillText(s,x,y);
}

rect(-9,-10,7,15+swing,color);
rect(2,-10,7,15-swing,color);
rect(-10,1+swing,9,5,'#5a6c68');
rect(2,1-swing,9,5,'#5a6c68');
rect(-18,-29+swing,7,20,color);
rect(11,-29-swing,7,20,color);
ellipse(-14,-9+swing,4,4,'#eff0d9');
ellipse(14,-9-swing,4,4,'#eff0d9');
ellipse(0,-42,15,16,color,'#a9ccc5');
ellipse(0,-43,10,10,'#193e51','#91bec4');
line([[-5,-48],[2,-50],[6,-47]],'#bce8e8',2);
rect(-5,-24,10,7,'#79988b',null,2);

/* HÌNH DÁNG DỤNG CỤ */
function drawTool(id,x,y,scale=1,c=ctx){
c.save();c.translate(x,y);c.scale(scale,scale);
c.lineCap='round';c.lineJoin='round';
const stroke=(pts,col,w)=>{
c.beginPath();c.moveTo(...pts[0]);
pts.slice(1).forEach(p=>c.lineTo(...p));
c.strokeStyle=col;c.lineWidth=w;c.stroke();
};
const box=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
const ring=(x,y,r,col,w=2)=>{
c.beginPath();c.arc(x,y,r,0,Math.PI*2);
c.strokeStyle=col;c.lineWidth=w;c.stroke();
};

if(id===0){
stroke([[-5,-7],[8,10]],'#d3e8ed',6);
c.beginPath();
c.moveTo(-13,-12);c.lineTo(-9,-15);c.lineTo(-8,-7);
c.lineTo(-2,-4);c.lineTo(2,-9);c.lineTo(-4,-14);
c.lineTo(2,-15);c.lineTo(7,-9);c.lineTo(4,-1);
c.lineTo(-4,2);c.lineTo(-12,-3);c.closePath();
c.fillStyle='#d3e8ed';c.fill();
ring(8,10,2,'#567682',2);
}else if(id===1){
box(-11,-12,22,24,'#3c987e');box(-5,-5,10,10,'#163849');
for(let i=-8;i<=8;i+=8){
stroke([[-15,i],[-11,i]],'#f2cc86',2);
stroke([[11,i],[15,i]],'#f2cc86',2);
}
stroke([[-8,-8],[-2,-8],[-2,-5]],'#a7f8cc',2);
stroke([[5,2],[8,2],[8,9]],'#a7f8cc',2);
}else if(id===2){
box(-11,-13,22,26,'#b1c8cc');box(-8,-10,16,20,'#325261');
for(let i=-6;i<=6;i+=4)stroke([[i,-8],[i,8]],'#a8d8d9',1);
for(let i=-6;i<=6;i+=4)stroke([[-6,i],[6,i]],'#a8d8d9',1);
}else if(id===3){
c.beginPath();c.moveTo(0,-15);
c.lineTo(13,-9);c.lineTo(10,7);c.lineTo(0,16);
c.lineTo(-10,7);c.lineTo(-13,-9);c.closePath();
c.fillStyle='#90b7ca';c.fill();
stroke([[0,-9],[0,9]],'#e3f5e8',3);
stroke([[-7,-1],[7,-1]],'#e3f5e8',3);
}else if(id===4){
box(-7,-10,14,22,'#63b7cf');box(-4,-15,8,5,'#b5dbe0');
ring(0,0,5,'#d6ffff',1);
stroke([[-4,0],[4,0]],'#d6ffff',1);

/* TRỢ LÝ NGOẠI TUYẾN */

.replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
}
function answer(s){
const n=normalize(s),has=(...keys)=>keys.some(k=>n.includes(k));

if(has('ket qua','bao cao','result','report','结果','报告')){
const r=g.lab.reports.at(-1);
if(!r)return T('noReports');
return r.id+':\n'+r.items.map(item=>
item.id+' — '+sampleText(item,'name')+'\n'+sampleText(item,'composition')
).join('\n')+'\n'+T('viewReports');
}
if(has('dung cu','co le','tools','wrench','工具','扳手')){
return T('getTools')+'. '+T('guide');
}
if(has('phan tich','nghien cuu','research','analysis','研究','分析')){
return T('research')+' · '+siteName(7)+'. '+T('labTitle')
+': '+T('scanning')+' → '+T('analyzing')+' (6s). '+T('viewReports');
}
if(has('robot','lay mau','mau dat','soil','sample','机器人','月壤')){
return (prefs.name||'BIP')+': '+Math.ceil(g.robot.battery)+'%. '
+T('samples')+': '+g.robot.samples+'/3. '
+(g.robot.samples>=3?T('samplesFull'):T('guide'));
}
if(/(qua ngay|di nghi|ve nghi|ngu|\brest\b|\bsleep\b|next day|睡觉)/.test(n)){
return (done()?T('objectiveDone'):T('restLocked'))
+' '+T('rest')+' → '+T('restBed');
}
if(has('ham','tam chan','thien thach','shelter','shield','meteor','避难','陨石')){
return T('guide');
}
if(has('tau dau tien','first spacecraft','first probe','luna 2','第一艘')){
return T('fact')[6]+' '+T('fact')[3];
}
if(has('apollo','armstrong','aldrin','collins','阿波罗'))return T('fact')[3];
if(has('trong luc','gravity','重力'))return T('fact')[0];
if(has('khoang cach','distance','bao xa','距离'))return T('fact')[1];

if(has('pha trang','chu ky','phase','cycle','月相','周期'))return T('fact')[4];
if(has('anh sang','phat sang','light','shine','发光'))return T('fact')[5];

+T('stock')+': '+g.foodStock+'; '+T('inventory')+': '+g.food;
}
if(has('nhiem vu','sua','mission','repair','任务','修')){
return T('repair')+':\n'+g.tasks.map(t=>
(t.done?'✓ ':'○ ')+siteName(t.site)+' — '+toolName(t.tool)
+' × '+g.inventory[t.tool]).join('\n')+'\n'+T('guide');
}

/* CÀI ĐẶT */
function pause(){
if(g.status==='playing'){
g.status='paused';held.clear();save();
}else if(g.status==='paused'){
g.status='playing';void Audio.init();
}
render();
}
function openDialog(id){
if(['sleeping','rescue'].includes(g.status))return;
modalResume=g.status==='playing';
if(modalResume)pause();
held.clear();$(id).showModal();
}
function closeDialog(id){
$(id).close();

modalResume=false;void Audio.init();
}
function syncSettings(){
$('language').value=prefs.lang;$('nameInput').value=prefs.name;
for(const [id,key]of [
['soundToggle','sound'],['musicToggle','music'],['sfxToggle','sfx']
])$(id).checked=prefs[key];
for(const [id,key,out]of [
['masterRange','master','masterOut'],
['musicRange','musicVolume','musicOut'],
['sfxRange','sfxVolume','sfxOut']
]){
$(id).value=prefs[key];$(out).textContent=prefs[key]+'%';

}

function typing(){
const t=document.activeElement;
return ['INPUT','TEXTAREA','SELECT'].includes(t?.tagName)
||document.querySelector('dialog[open]');
}
function press(k){
if(g.status!=='playing')return;
if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright']
.includes(k))route=[];
held.add(k);
if(k==='e')interact();
if(k==='f')eat();
if(k==='g')toggleBase();
if(k==='h')toggleShelter();
if(k==='r')rest();
if(k==='c')carry();
}
window.addEventListener('keydown',e=>{
if(typing())return;
const k=e.key.toLowerCase();
if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)){
e.preventDefault();
}
if(e.repeat)return;
if(k==='p'){pause();return}
press(k);
});
window.addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>{
held.clear();if(g.status==='playing')pause();
});
document.addEventListener('visibilitychange',()=>{
if(document.hidden&&g.status==='playing')pause();
});
window.addEventListener('beforeunload',save);

document.querySelectorAll('[data-key]').forEach(b=>{
b.addEventListener('pointerdown',e=>{
e.preventDefault();b.setPointerCapture(e.pointerId);
void Audio.init();press(b.dataset.key);
});
for(const event of ['pointerup','pointercancel','lostpointercapture']){
b.addEventListener(event,()=>held.delete(b.dataset.key));
}
});
canvas.addEventListener('pointerdown',e=>{
if(g.status!=='playing'||document.querySelector('dialog[open]'))return;
void Audio.init();
const r=canvas.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
if(isInside()){
if(g.insideBase&&x>205&&x<420&&y>380&&y<475){goRoom(BED,'sleep');return}
if(x>645&&x<719&&y>270&&y<420){goRoom(DOOR,'exit');return}
if(g.insideBase&&x>425&&x<645&&y>260&&y<340){goRoom(TOOL_RACK);return}
if(x>195&&x<390&&y>260&&y<340){goRoom(CONSOLE);return}
if(!blocked(x,y))goRoom({x,y});
return;
}
for(let i=0;i<buildings.length;i++){
const b=buildings[i];
if(Math.abs(x-b.x)<b.w/2+15&&Math.abs(y-b.y)<b.h/2+35){
gotoSite(i);return;
}
}
});

/* KHỞI ĐỘNG */
function frame(t){
const dt=Math.min(.04,(t-last)/1000||0);
last=t;visual+=dt;
Audio.tick();update(dt);draw();
hudTime+=dt;
if(hudTime>.1){hudTime=0;render()}
requestAnimationFrame(frame);
}

g=fresh();
daySetup();
g.status='ready';
translate();
addMessage('assistant',T('hello'));
$('continueBtn').hidden=!load();
$('startDialog').showModal();
requestAnimationFrame(frame);
</script>
